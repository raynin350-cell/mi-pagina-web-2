<!DOCTYPE html>
<html>
    <head>
        <title>Reservaciones</title>
    </head>
    <body>
        <header>
            <h1>Reservaciones</h1>
        </header>
        <form>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email">
            <br>
            <br>
            <label for="fecha">Fecha para reserva</label>
            <input type="text" id="fecha" name="fecha" placeholder="Fecha" maxlength="10">
            <br>
            <br>
            <label for="cantidad">Cantidad de personas</label>
            <input type="number" id="cantidad" name="cantidad" placeholder="Cantidad de personas">
            <br>
            <br>    
            <label for="comentario">comentario</label>
            <input type="text" id="comentario" name="comentario" placeholder="Comentario">
            <br><br>
            <button type="reset">Limpiar</button>
            <button type="submit">Reservar</button>
        </form>
        <br>
        <br>
        <a href="menu.html"><h3>Nuestro menu</h3></a>
    </body>
</html>
